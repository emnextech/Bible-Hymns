<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Bible &amp; Hymns</title>
  <defs>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="1" stop-color="#1A5FD0"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BAAF7"/>
      <stop offset="1" stop-color="#4285F4"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBC04"/>
      <stop offset="1" stop-color="#F29900"/>
    </linearGradient>
  </defs>

  <g transform="translate(0 -26)">
  <!-- bookmark ribbon, emerging below the spine -->
  <path d="M236 380 H276 V468 L256 448 L236 468 Z" fill="url(#ribbon)"/>

  <!-- left page (Bible) -->
  <path d="M246 140 C 196 104 128 96 72 106 C 58 108 50 118 50 132 V 370 C 50 386 62 396 78 393 C 130 383 196 388 246 420 Z" fill="url(#pageL)"/>
  <!-- right page (Hymns) -->
  <path d="M266 140 C 316 104 384 96 440 106 C 454 108 462 118 462 132 V 370 C 462 386 450 396 434 393 C 382 383 316 388 266 420 Z" fill="url(#pageR)"/>

  <!-- cross -->
  <rect x="139" y="176" width="26" height="150" rx="9" fill="#FFFFFF"/>
  <rect x="104" y="214" width="96" height="26" rx="9" fill="#FFFFFF"/>

  <!-- eighth note -->
  <path d="M352 178 C 352 172 357 168 363 169 C 392 174 412 196 410 226 C 409 236 398 238 394 230 C 389 218 382 210 374 206 V 304 C 374 330 350 350 322 346 C 300 343 290 326 296 309 C 303 290 328 278 352 284 Z" fill="#FFFFFF"/>
</g>
</svg>
