<style>
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f8f9fa; --surface-3: #f1f3f4; --line: #dadce0;
  --text: #202124; --text-2: #5f6368; --text-3: #80868b; --link: #1a0dab;
  --primary: #1a73e8; --primary-soft: #e8f0fe; --on-primary: #ffffff;
  --green: #188038; --green-soft: #e6f4ea; --red: #d93025; --red-soft: #fce8e6; --yellow-soft: #fef7e0;
  --inv-bg: #303134; --inv-text: #f1f3f4; --inv-primary: #8ab4f8;
  --mark: #fde293; --code-bg: #f8f9fa;
  --j-key: #1967d2; --j-str: #188038; --j-num: #c5221f; --j-bool: #9334e6; --j-null: #80868b;
  --shadow-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
  --ease: cubic-bezier(.2,0,0,1);
  --read-scale: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202124; --surface: #292a2d; --surface-2: #2a2b2e; --surface-3: #35363a; --line: #3c4043;
    --text: #e8eaed; --text-2: #9aa0a6; --text-3: #80868b; --link: #8ab4f8;
    --primary: #8ab4f8; --primary-soft: rgba(138,180,248,.16); --on-primary: #202124;
    --green: #81c995; --green-soft: rgba(129,201,149,.16); --red: #f28b82; --red-soft: rgba(242,139,130,.16); --yellow-soft: rgba(253,214,99,.12);
    --inv-bg: #e8eaed; --inv-text: #202124; --inv-primary: #1a73e8;
    --mark: rgba(253,214,99,.32); --code-bg: #1b1c1f;
    --j-key: #8ab4f8; --j-str: #81c995; --j-num: #f28b82; --j-bool: #c58af9; --j-null: #9aa0a6;
    --shadow-1: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-2: 0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #202124; --surface: #292a2d; --surface-2: #2a2b2e; --surface-3: #35363a; --line: #3c4043;
  --text: #e8eaed; --text-2: #9aa0a6; --text-3: #80868b; --link: #8ab4f8;
  --primary: #8ab4f8; --primary-soft: rgba(138,180,248,.16); --on-primary: #202124;
  --green: #81c995; --green-soft: rgba(129,201,149,.16); --red: #f28b82; --red-soft: rgba(242,139,130,.16); --yellow-soft: rgba(253,214,99,.12);
  --inv-bg: #e8eaed; --inv-text: #202124; --inv-primary: #1a73e8;
  --mark: rgba(253,214,99,.32); --code-bg: #1b1c1f;
  --j-key: #8ab4f8; --j-str: #81c995; --j-num: #f28b82; --j-bool: #c58af9; --j-null: #9aa0a6;
  --shadow-1: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-2: 0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
  color-scheme: dark;
}

@font-face { font-family: 'Material Symbols Rounded'; font-style: normal; font-weight: 400; font-display: block; src: url(fonts/material-symbols-rounded.woff2) format('woff2'); }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font: 400 15px/1.6 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  transition: background-color .25s, color .25s;
  overflow-x: hidden;
}
a { color: var(--primary); text-decoration: none; }
h1, h2, h3 { line-height: 1.2; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[hidden] { display: none !important; }
.msr {
  font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1;
  display: inline-block; white-space: nowrap; letter-spacing: normal; text-transform: none; direction: ltr;
  font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; user-select: none; flex-shrink: 0;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  width: 1em; height: 1em; overflow: hidden; vertical-align: middle;
}
.msr.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.msr.sm { font-size: 18px; }
.spacer { flex: 1; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.center { display: flex; justify-content: center; margin-top: 20px; }
.dim { opacity: .45; pointer-events: none; transition: opacity .2s; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ---------- progress, boot, loaders ---------- */
#progress { position: fixed; top: 0; right: 0; left: 0; height: 3px; z-index: 400; overflow: hidden; opacity: 0; transition: opacity .25s; pointer-events: none; background: var(--primary-soft); }
#progress.on { opacity: 1; }
#progress::before, #progress::after { content: ""; position: absolute; top: 0; bottom: 0; background: var(--primary); }
#progress::before { animation: lp1 2.1s cubic-bezier(.65,.815,.735,.395) infinite; }
#progress::after { animation: lp2 2.1s cubic-bezier(.165,.84,.44,1) 1.15s infinite; }
@keyframes lp1 { 0% { left: -35%; right: 100%; } 60%, 100% { left: 100%; right: -90%; } }
@keyframes lp2 { 0% { left: -200%; right: 100%; } 60%, 100% { left: 107%; right: -8%; } }

#boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 500; background: var(--bg); display: grid; place-items: center; transition: opacity .4s var(--ease), visibility .4s; }
#boot.hide { opacity: 0; visibility: hidden; }
.boot-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.boot-inner .brand-logo { width: 84px; height: 84px; animation: breathe 1.8s var(--ease) infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.dots { display: inline-flex; gap: 6px; align-items: center; justify-content: center; vertical-align: middle; }
.dots i { width: 9px; height: 9px; border-radius: 50%; animation: bounce 1.1s infinite ease-in-out both; }
.dots i:nth-child(1) { background: #4285f4; animation-delay: -.36s; }
.dots i:nth-child(2) { background: #ea4335; animation-delay: -.24s; }
.dots i:nth-child(3) { background: #fbbc04; animation-delay: -.12s; }
.dots i:nth-child(4) { background: #34a853; }
.dots.sm { gap: 4px; } .dots.sm i { width: 6px; height: 6px; }
.dots.mono i { background: currentColor; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0) scale(.8); opacity: .55; } 40% { transform: translateY(-8px) scale(1); opacity: 1; } }
.dots.sm i { animation-name: bounce-sm; }
@keyframes bounce-sm { 0%, 80%, 100% { transform: translateY(0) scale(.8); opacity: .55; } 40% { transform: translateY(-5px) scale(1); opacity: 1; } }
.loading-block { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 56px 0; color: var(--text-2); font-size: 14px; }

.sk { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 37%, var(--surface-3) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
.sk-line { height: 14px; margin: 14px 0; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

.view { animation: enter .3s var(--ease); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: enter .36s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- app bar & navigation ---------- */
.appbar { position: -webkit-sticky; position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid transparent; transition: border-color .2s, background-color .25s; }
.appbar.scrolled { border-color: var(--line); }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) and (background: color-mix(in srgb, red 50%, blue)) {
  .appbar { background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: saturate(1.5) blur(14px); backdrop-filter: saturate(1.5) blur(14px); }
}
.appbar-inner { max-width: 1200px; margin: 0 auto; height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 500; font-size: 18px; white-space: nowrap; }
.brand-logo { width: 36px; height: 36px; display: block; flex-shrink: 0; }
.badge-api { font-size: 11px; font-weight: 700; letter-spacing: .6px; padding: 2px 7px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); }
.tabs-top { display: flex; gap: 4px; margin: 0 auto; min-width: 0; overflow: hidden; }
.brand, .actions { flex-shrink: 0; }
@media (max-width: 980px) { .tab { padding: 0 12px; } .tab .msr { display: none; } .appbar-inner { gap: 4px; } }
.tab { position: relative; overflow: hidden; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 20px; color: var(--text-2); font-weight: 500; font-size: 14px; transition: background-color .2s, color .2s; }

.tab.active { background: var(--primary-soft); color: var(--primary); }
.tab.active .msr { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.actions { display: flex; gap: 2px; align-items: center; }
#openLog { overflow: visible; }
.badge { position: absolute; z-index: 1; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--primary); color: var(--on-primary); font: 700 10px/18px Roboto, sans-serif; text-align: center; animation: popin .25s var(--ease); }
@keyframes popin { from { transform: scale(.4); opacity: 0; } }

.bottomnav { display: none; position: fixed; right: 0; bottom: 0; left: 0; z-index: 50; height: calc(72px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface-2); border-top: 1px solid var(--line); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-2); font-size: 12px; font-weight: 500; }
.nav-item .pill { position: relative; overflow: hidden; width: 60px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background-color .25s var(--ease); }
.nav-item.active { color: var(--text); }
.nav-item.active .pill { background: var(--primary-soft); color: var(--primary); }
.nav-item.active .msr { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

.container { max-width: 1100px; margin: 0 auto; padding: 8px 20px 40px; min-height: calc(100vh - 160px); }
footer { max-width: 1100px; margin: 0 auto; padding: 24px 20px 32px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
footer a { color: var(--text-2); }

@media (max-width: 760px) {
  .tabs-top { display: none; }
  .actions { margin-left: auto; }
  .bottomnav { display: flex; }
  .container { padding: 4px 16px 32px; }
  footer { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  html { scroll-padding-top: 120px; }
}

/* ---------- buttons, chips, inputs ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 22px 0 18px; border-radius: 20px; border: 0; font-size: 14px; font-weight: 500; letter-spacing: .1px; cursor: pointer; background: var(--primary); color: var(--on-primary); transition: box-shadow .2s, background-color .2s, opacity .2s; white-space: nowrap; text-decoration: none; }
.btn .msr { font-size: 20px; }

.btn.tonal { background: var(--primary-soft); color: var(--primary); }

.btn.outline { background: transparent; color: var(--primary); border: 1px solid var(--line); }

.btn.text { background: transparent; color: var(--primary); padding: 0 14px 0 10px; }

.btn.loading { pointer-events: none; }
.icon-btn { position: relative; overflow: hidden; width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; border: 0; background: transparent; color: var(--text-2); cursor: pointer; flex-shrink: 0; transition: background-color .2s, color .2s; }

.icon-btn.disabled { opacity: .3; pointer-events: none; }
.ripple { position: absolute; border-radius: 50%; transform: scale(0); background: currentColor; opacity: .2; animation: ripple .6s var(--ease) forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.center { justify-content: center; }
.chip { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background-color .2s, color .2s, border-color .2s; }

.chip.active { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.chip.static { cursor: default; }
.chip .msr { font-size: 18px; }

.search-pill { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 4px 0 16px; border-radius: 24px; background: var(--surface-3); border: 1px solid transparent; transition: box-shadow .2s, background-color .2s, border-color .2s; }
.search-pill:focus-within { background: var(--surface); box-shadow: var(--shadow-2); }
.search-pill.big { height: 56px; border-radius: 28px; background: var(--surface); border-color: var(--line); padding-left: 20px; }
.search-pill.big:focus-within { box-shadow: var(--shadow-2); border-color: transparent; }
.search-pill > .msr:first-child { color: var(--text-2); }
.search-pill input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; }
.search-pill input::-webkit-search-cancel-button { display: none; }
.pill-loader { padding: 0 8px; }

/* ---------- cards & common layout ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.card-head { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-weight: 500; font-size: 14px; margin: -8px -8px 6px 0; }
.card-head .msr { color: var(--primary); }
.grid { display: grid; gap: 16px; }
.two { grid-template-columns: 1fr 1fr; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 20px 0; }
.page-head h1 { margin: 0 0 2px; font-size: clamp(26px, 4vw, 34px); font-weight: 500; letter-spacing: -.3px; }
.page-head p { margin: 0; }
.h2 { font-size: 20px; font-weight: 500; margin: 44px 0 16px; }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; margin: 28px 0 10px; color: var(--text); }
.section-title .msr { color: var(--primary); font-size: 20px; }
.section-title .count { font-size: 12px; color: var(--text-2); background: var(--surface-3); padding: 1px 8px; border-radius: 10px; font-weight: 500; }
.eyebrow { font-size: 12px; letter-spacing: .9px; text-transform: uppercase; color: var(--text-2); font-weight: 500; }

.state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 56px 16px; color: var(--text-2); animation: enter .3s var(--ease); }
.state .big-ic { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); margin-bottom: 6px; }
.state .big-ic .msr { font-size: 38px; }
.state.error .big-ic { background: var(--red-soft); color: var(--red); }
.state h3 { margin: 0; color: var(--text); font-weight: 500; font-size: 18px; }
.state p { margin: 0 0 8px; max-width: 420px; }

/* ---------- home ---------- */
.hero { text-align: center; padding: 40px 0 12px; }
.hero-logo { width: 88px; height: 88px; display: block; margin: 0 auto; animation: enter .5s var(--ease); filter: drop-shadow(0 6px 14px rgba(26,115,232,.22)); }
.hero-ctas { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
.brand-name { letter-spacing: -.2px; } .brand-name .amp { color: var(--text-2); font-weight: 400; }
.dev-band { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 28px; align-items: center; margin-top: 56px; padding: 32px; border-radius: 28px; background: var(--surface-2); border: 1px solid var(--line); }
.dev-band h2 { font-size: clamp(24px, 3.4vw, 30px); font-weight: 500; margin: 14px 0 10px; letter-spacing: -.3px; }
.dev-band p { margin: 0 0 20px; }
.dev-band .live-pill { margin-top: 18px; }
.dev-code { min-width: 0; padding: 8px 16px 16px; }
.eyebrow-pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; background: var(--green-soft); color: var(--green); font-size: 13px; font-weight: 500; }
@media (max-width: 860px) { .dev-band { grid-template-columns: minmax(0, 1fr); padding: 22px 18px; } }
.hero h1 { font-size: clamp(30px, 6.2vw, 54px); line-height: 1.1; font-weight: 500; letter-spacing: -1px; margin: 22px 0 14px; }
.accent { background: linear-gradient(90deg, #4285f4, #9b72cb 55%, #d96570); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--text-2); font-size: clamp(15px, 2.2vw, 18px); max-width: 600px; margin: 0 auto 30px; }
.hero .search-pill { max-width: 640px; margin: 0 auto 18px; }
.hero .chips { justify-content: center; }
.live-pill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; border-radius: 15px; background: var(--surface-3); color: var(--text-2); font-size: 13px; font-weight: 500; transition: background-color .3s, color .3s; }
.live-pill.ok { background: var(--green-soft); color: var(--green); }
.live-pill.bad { background: var(--red-soft); color: var(--red); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.live-pill.ok .pulse { animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 168, 83, .55); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.stats { grid-template-columns: repeat(4, 1fr); margin-top: 40px; }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat > .msr { color: var(--primary); margin-bottom: 6px; }
.stat .num { font-size: 30px; font-weight: 500; letter-spacing: -.5px; min-height: 38px; display: flex; align-items: center; }
.stat .lbl { color: var(--text-2); font-size: 13px; }
.quote { font-family: 'Roboto Serif', Georgia, serif; font-size: 19px; line-height: 1.65; margin: 4px 0 12px; }
.ref { font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.features { grid-template-columns: repeat(4, 1fr); }
.feature { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 18px; border: 1px solid var(--line); color: var(--text); transition: box-shadow .25s, transform .25s var(--ease), border-color .25s; }

.feature .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
.feature b { font-weight: 500; font-size: 16px; }
.feature span.d { color: var(--text-2); font-size: 14px; }
@media (max-width: 860px) { .stats, .features { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .features { grid-template-columns: 1fr; } .stat .num { font-size: 26px; } }

/* ---------- segmented tabs & code ---------- */
.seg { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { position: relative; border: 0; background: none; padding: 12px 16px; font-size: 14px; font-weight: 500; color: var(--text-2); cursor: pointer; white-space: nowrap; border-radius: 8px 8px 0 0; transition: color .2s, background-color .2s; }

.seg button.active { color: var(--primary); }
.seg button.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); animation: grow .25s var(--ease); }
@keyframes grow { from { transform: scaleX(.3); opacity: 0; } }
.code-wrap { position: relative; }
.code-wrap .copy { position: absolute; top: 8px; right: 8px; background: var(--surface); box-shadow: var(--shadow-1); }
pre.code { margin: 0; padding: 18px 56px 18px 18px; border-radius: 14px; background: var(--code-bg); border: 1px solid var(--line); font: 13px/1.65 'Roboto Mono', ui-monospace, monospace; overflow: auto; max-height: 560px; white-space: pre; tab-size: 2; color: var(--text); transition: opacity .2s; }
.j-key { color: var(--j-key); } .j-str { color: var(--j-str); } .j-num { color: var(--j-num); } .j-bool { color: var(--j-bool); } .j-null { color: var(--j-null); }

/* ---------- reader ---------- */
.reader-bar { position: -webkit-sticky; position: sticky; top: 64px; z-index: 10; display: flex; align-items: center; gap: 6px; padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); transition: background-color .25s; }

.reader { max-width: 720px; margin: 0 auto; }

.verses { font-family: 'Roboto Serif', Georgia, serif; font-size: calc(18px * var(--read-scale)); line-height: 1.85; }
.verse { margin: 0 -10px; padding: 4px 10px; border-radius: 10px; cursor: pointer; transition: background-color .2s; }

.verse sup, .passage-text sup { font-family: Roboto, sans-serif; font-size: .58em; font-weight: 700; color: var(--primary); margin-right: 5px; vertical-align: .5em; }
.pager { display: flex; justify-content: space-between; gap: 12px; max-width: 720px; margin: 40px auto 0; }
.pager a { position: relative; overflow: hidden; flex: 1; max-width: 50%; display: flex; flex-direction: column; gap: 2px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 16px; color: var(--text); font-weight: 500; transition: background-color .2s, box-shadow .2s; }

.pager .dir { font-size: 12px; color: var(--text-2); font-weight: 400; display: flex; align-items: center; gap: 2px; }
.pager .next { text-align: right; margin-left: auto; align-items: flex-end; }
@media (max-width: 560px) { .reader-bar .hide-sm { display: none; } .reader-bar .btn { font-size: 13px; padding: 0 6px 0 12px; } }

#selbar { position: fixed; left: 50%; bottom: 24px; z-index: 60; display: flex; align-items: center; gap: 2px; padding: 6px 6px 6px 20px; border-radius: 28px; background: var(--inv-bg); color: var(--inv-text); box-shadow: var(--shadow-2); transform: translate(-50%, 160%); opacity: 0; visibility: hidden; transition: transform .3s var(--ease), opacity .25s, visibility .3s; font-size: 14px; font-weight: 500; white-space: nowrap; }
#selbar.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
#selbar .icon-btn { color: var(--inv-text); }

#selbar span { margin-right: 8px; }

/* ---------- sheets / dialogs ---------- */
dialog.sheet { border: 0; padding: 0; margin: auto; width: min(640px, calc(100vw - 32px)); max-height: min(82vh, 760px); border-radius: 28px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-2); overflow: hidden; flex-direction: column; }
dialog.sheet[open] { display: flex; animation: pop .26s var(--ease); }
dialog.sheet.wide { width: min(860px, calc(100vw - 32px)); }
dialog.sheet.closing { animation: popout .17s ease-in forwards; }
dialog.sheet.fallback { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1000; height: -webkit-fit-content; height: fit-content; }
.sheet-backdrop { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 999; background: rgba(0,0,0,.42); animation: fade .25s; }
.sheet-backdrop.closing { animation: fadeout .17s forwards; }
dialog.sheet::backdrop { background: rgba(0,0,0,.42); animation: fade .25s; }
dialog.sheet.closing::backdrop { animation: fadeout .17s forwards; }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(10px); } }
@keyframes popout { to { opacity: 0; transform: scale(.96) translateY(6px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
.sheet-handle { display: none; width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 10px auto 0; flex-shrink: 0; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 18px 12px 10px 24px; flex-shrink: 0; }
.sheet-head h2 { flex: 1; margin: 0; font-size: 20px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.sheet-head h2 .icon-btn { margin-left: -12px; }
.sheet-body { overflow: auto; -webkit-overflow-scrolling: touch; padding: 4px 24px 24px; overscroll-behavior: contain; }
@media (max-width: 760px) {
  dialog.sheet, dialog.sheet.wide { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 28px 28px 0 0; max-height: 88vh; padding-bottom: env(safe-area-inset-bottom); }
  dialog.sheet[open] { animation: slideup .32s var(--ease); }
  dialog.sheet.closing { animation: slidedown .2s ease-in forwards; }
  .sheet-handle { display: block; }
  .sheet-head { padding-top: 10px; }
}
@keyframes slideup { from { transform: translateY(100%); } }
@keyframes slidedown { to { transform: translateY(100%); } }
.section-label { font-size: 12px; letter-spacing: .9px; text-transform: uppercase; color: var(--text-2); font-weight: 500; margin: 18px 0 8px; }
.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; }
.book-btn { position: relative; overflow: hidden; text-align: left; padding: 10px 12px; border-radius: 12px; border: 0; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; transition: background-color .15s; }

.book-btn.current, .ch-btn.current { background: var(--primary); color: var(--on-primary); font-weight: 500; }
.ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
.ch-btn { position: relative; overflow: hidden; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 15px; font-weight: 500; cursor: pointer; transition: background-color .15s; }


/* ---------- lists & results ---------- */
.list { display: flex; flex-direction: column; gap: 2px; }
.list-item { position: relative; overflow: hidden; display: flex; align-items: center; gap: 16px; padding: 12px 16px; margin: 0 -16px; border-radius: 16px; color: var(--text); transition: background-color .15s; }

.num-badge { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 500; flex-shrink: 0; }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 500; }
.li-sub { color: var(--text-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-meta { color: var(--text-3); font-size: 13px; white-space: nowrap; }
@media (max-width: 560px) { .li-meta { display: none; } }
.result { padding: 16px 0; border-bottom: 1px solid var(--line); }
.result:last-child { border-bottom: 0; }
.crumb { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
.result h3 { margin: 3px 0 4px; font-size: 19px; font-weight: 400; }
.result h3 a { color: var(--link); }

.result p { margin: 0; color: var(--text-2); line-height: 1.6; }
.passage { margin-top: 20px; border-left: 4px solid var(--primary); }
.passage h2 { font-family: 'Roboto Serif', Georgia, serif; font-weight: 500; margin: 6px 0 10px; font-size: 24px; }
.passage-text { font-family: 'Roboto Serif', Georgia, serif; font-size: 17px; line-height: 1.8; margin-bottom: 14px; }
.filters { margin: 14px 0 4px; }

/* ---------- hymn ---------- */
.hymn { max-width: 720px; margin: 0 auto; }
.back { margin: 16px 0 0 -10px; }
.hymn-head { text-align: center; margin: 12px 0 18px; }
.hymn-head .chips { margin-top: 16px; }
.toolbar { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 28px; }
@media (max-width: 400px) { .toolbar { gap: 2px; } .toolbar .btn { padding: 0 14px 0 12px; } .toolbar .icon-btn { width: 36px; } }
.scripture-card { background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 14px; padding: 14px 18px; margin: 0 0 30px; font-family: 'Roboto Serif', Georgia, serif; font-style: italic; line-height: 1.7; }
.scripture-card p { margin: 0; }
.scripture-card cite { display: block; font-style: normal; font-family: Roboto, sans-serif; font-size: 13px; font-weight: 500; margin-top: 8px; }
.part { display: flex; gap: 18px; margin: 0 0 26px; font-family: 'Roboto Serif', Georgia, serif; font-size: calc(18px * var(--read-scale)); line-height: 1.75; }
.part-label { flex-shrink: 0; width: 32px; height: 32px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); font: 500 14px Roboto, sans-serif; }
.part.chorus { flex-direction: column; gap: 8px; padding: 16px 20px; border-radius: 18px; background: var(--primary-soft); font-style: italic; margin-left: 50px; }
.part.chorus .part-label { width: auto; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--primary); color: var(--on-primary); font-size: 11px; letter-spacing: .8px; text-transform: uppercase; font-style: normal; align-self: flex-start; }
@media (max-width: 560px) { .part.chorus { margin-left: 0; } .part { gap: 12px; } }

.present { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 300; background: #0c0d0f; color: #fff; display: flex; flex-direction: column; animation: fade .25s; }
.present-top, .present-nav { display: flex; align-items: center; gap: 8px; padding: 12px 16px; color: #bdc1c6; font-size: 14px; }
.present .icon-btn { color: #e8eaed; }
.present-stage { flex: 1; display: grid; place-items: center; padding: 16px 7vw; text-align: center; cursor: pointer; user-select: none; overflow: hidden; }
.present-slide { animation: slidein .35s var(--ease); }
@keyframes slidein { from { opacity: 0; transform: translateY(14px); } }
.present-label { font: 500 13px Roboto, sans-serif; letter-spacing: 2.5px; text-transform: uppercase; color: #8ab4f8; margin-bottom: 22px; }
.present-text { font-family: 'Roboto Serif', Georgia, serif; font-size: clamp(22px, 4.4vw, 60px); line-height: 1.4; }
.present-bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
.present-bar i { display: block; height: 100%; background: #8ab4f8; border-radius: 2px; transition: width .35s var(--ease); }

/* ---------- explorer ---------- */
.explorer { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.ep-list { position: -webkit-sticky; position: sticky; top: 80px; display: flex; flex-direction: column; gap: 2px; }
.ep-group { font-size: 12px; letter-spacing: .9px; text-transform: uppercase; color: var(--text-2); font-weight: 500; margin: 14px 14px 6px; }
.ep-group:first-child { margin-top: 0; }
.ep-item { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 20px; color: var(--text); font-size: 14px; transition: background-color .15s; }

.ep-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
.method { font: 700 10.5px/1 'Roboto Mono', monospace; letter-spacing: .4px; padding: 4px 6px; border-radius: 6px; background: var(--green-soft); color: var(--green); flex-shrink: 0; }
.ep-panel { min-width: 0; }
.ep-panel h2 { margin: 0 0 4px; font-size: 22px; font-weight: 500; }
.ep-panel > p { margin: 0 0 16px; }
.endpoint-line { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--code-bg); border: 1px solid var(--line); font: 14px 'Roboto Mono', monospace; overflow-x: auto; white-space: nowrap; }
.endpoint-line .p { color: var(--primary); font-weight: 500; }
.params { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin: 18px 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12px; font-weight: 500; color: var(--text); font-family: 'Roboto Mono', monospace; }
.field-label em { font-style: normal; color: var(--text-3); font-weight: 400; font-family: Roboto, sans-serif; }
.field input { height: 44px; width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; font: 15px 'Roboto Mono', monospace; outline: 0; transition: border-color .15s, box-shadow .15s; }
.field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
#epForm .row { margin-top: 18px; }
.url-bar { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 4px 4px 14px; border: 1px solid var(--line); border-radius: 14px; margin: 18px 0 8px; background: var(--surface); }
.url-bar code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: 13px 'Roboto Mono', monospace; scrollbar-width: none; padding: 10px 0; }
.url-bar code::-webkit-scrollbar { display: none; }
.url-bar.base { margin: 0 0 22px; }
.resp-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 52px; padding: 10px 0; font-size: 13px; color: var(--text-2); }
.resp-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.status { font: 500 12px 'Roboto Mono', monospace; padding: 5px 10px; border-radius: 12px; animation: popin .25s var(--ease); }
.status.ok { background: var(--green-soft); color: var(--green); }
.status.err { background: var(--red-soft); color: var(--red); }
@media (max-width: 860px) {
  .explorer { grid-template-columns: minmax(0, 1fr); }
  .ep-list { position: static; flex-direction: row; overflow-x: auto; gap: 8px; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
  .ep-list::-webkit-scrollbar { display: none; }
  .ep-group { display: none; }
  .ep-item { border: 1px solid var(--line); white-space: nowrap; flex-shrink: 0; }
  .ep-item.active { border-color: transparent; }
  .ep-panel { padding: 18px 16px; }
}

/* ---------- inspector ---------- */
.log { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; overflow: hidden; animation: enter .25s var(--ease); }
.log summary { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; list-style: none; transition: background-color .15s; }
.log summary::-webkit-details-marker { display: none; }

.log[open] summary { border-bottom: 1px solid var(--line); }
.log-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px 'Roboto Mono', monospace; }
.log-ms { font-size: 12px; color: var(--text-2); white-space: nowrap; }
.log-body { padding: 0 12px 12px; }
.log-body .url-bar { margin: 12px 0 10px; }
.log pre.code { max-height: 380px; }

#snackbar { position: fixed; left: 24px; bottom: 24px; z-index: 450; display: flex; align-items: center; gap: 12px; max-width: min(560px, calc(100vw - 32px)); min-height: 48px; padding: 6px 8px 6px 18px; border-radius: 8px; background: var(--inv-bg); color: var(--inv-text); box-shadow: var(--shadow-2); font-size: 14px; transform: translateY(150%); opacity: 0; visibility: hidden; transition: transform .3s var(--ease), opacity .3s, visibility .3s; pointer-events: none; }
#snackbar.show { transform: none; opacity: 1; visibility: visible; pointer-events: auto; }
#snackbar .btn.text { color: var(--inv-primary); }
@media (max-width: 760px) { #snackbar { left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); } #selbar { bottom: calc(88px + env(safe-area-inset-bottom)); } }

@media (prefers-reduced-motion: reduce) {
  /* Keep fades, loaders and feedback; drop large movement. */

  .feature:hover { transform: none; }
  html { scroll-behavior: auto; }
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* Hover effects only where a real pointer exists */
@media (hover: hover) {
  .tab:hover { background: var(--surface-3); color: var(--text); }
  footer a:hover { color: var(--primary); }

  .btn.outline:hover { background: var(--primary-soft); box-shadow: none; }
  .btn.text:hover { background: var(--primary-soft); box-shadow: none; }

  .chip:hover { background: var(--surface-3); color: var(--text); }

  .feature:hover { box-shadow: var(--shadow-2); transform: translateY(-3px); border-color: transparent; }
  .seg button:hover { background: var(--surface-3); color: var(--text); }
  .verse:hover { background: var(--surface-2); }
  .pager a:hover { background: var(--surface-2); }
  #selbar .icon-btn:hover { background: rgba(128, 128, 128, .22); }
  .book-btn:hover { background: var(--surface-3); }
  .ch-btn:hover { background: var(--surface-3); }
  a.list-item:hover { background: var(--surface-2); }

  .ep-item:hover { background: var(--surface-3); }
  .log summary:hover { background: var(--surface-2); }
}
</style>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Basics
// ---------------------------------------------------------------------------
const API_BASE = /^https?:$/.test(location.protocol) ? '' : 'https://bible-hymns.emnextech.dev';
const PUBLIC_BASE = API_BASE || location.origin;
const SUGGESTIONS = ['John 3:16', 'Psalm 23', 'Mark 5:36', 'only believe', 'blood of the lamb', 'Hebrews 11:1', 'grace', 'Jude 24-25'];

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;
const icon = (name, cls = '') => `<span class="msr ${cls}" aria-hidden="true">${name}</span>`;
const DOTS = '<span class="dots" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i></span>';
const DOTS_SM = '<span class="dots sm" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i></span>';
const DOTS_MONO = '<span class="dots sm mono" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i></span>';
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const aborted = (e) => e && e.name === 'AbortError';
const isDesktop = () => window.innerWidth > 760;
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const lastOf = (arr) => arr[arr.length - 1];
const WORDS_RE = (() => { try { return new RegExp("[\\p{L}\\p{N}']+", 'gu'); } catch (e) { return /[A-Za-z0-9\u00C0-\u024F']+/g; } })();
const HAS_WORD_RE = /[A-Za-z0-9\u00C0-\uFFFF]/;

const store = {
  get(k, d) { try { const v = localStorage.getItem('bh:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('bh:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

// ---------------------------------------------------------------------------
// Request layer — every call is timed and logged for the network inspector
// ---------------------------------------------------------------------------
class ApiError extends Error { constructor(msg, status) { super(msg); this.status = status; } }
const LOG = [];
const memo = new Map();
let reqSeq = 0, busy = 0;

function setBusy(d) { busy = Math.max(0, busy + d); $('#progress').classList.toggle('on', busy > 0); }

async function request(path, signal) {
  const entry = { id: ++reqSeq, path, url: PUBLIC_BASE + path, at: Date.now() };
  const t0 = performance.now();
  setBusy(1);
  try {
    const res = await fetch(API_BASE + path, { signal, headers: { Accept: 'application/json' } });
    const text = await res.text();
    entry.status = res.status;
    entry.size = new Blob([text]).size;
    try { entry.body = JSON.parse(text); } catch { entry.body = text; }
  } catch (e) {
    if (aborted(e)) throw e;
    entry.status = 0; entry.size = 0;
    entry.body = { error: navigator.onLine ? 'Could not reach the API. Check your connection and try again.' : 'You appear to be offline.' };
  } finally {
    entry.ms = Math.round(performance.now() - t0);
    setBusy(-1);
  }
  pushLog(entry);
  return entry;
}

async function api(path, { signal, cache = false } = {}) {
  if (cache && memo.has(path)) return memo.get(path);
  const entry = await request(path, signal);
  if (entry.status < 200 || entry.status >= 300) throw new ApiError(entry.body?.error || `Request failed (${entry.status})`, entry.status);
  if (cache) memo.set(path, entry.body);
  return entry.body;
}

let BOOKS = null, booksPromise = null;
function getBooks() {
  if (!booksPromise) booksPromise = api('/v1/books').then((d) => (BOOKS = d.books)).catch((e) => { booksPromise = null; throw e; });
  return booksPromise;
}
const slug = (b) => b.osis.toLowerCase();
const bookFromSlug = (s) => { s = decodeURIComponent(s || '').toLowerCase().replace(/\s+/g, ''); return BOOKS.find((b) => b.osis.toLowerCase() === s || b.name.toLowerCase().replace(/\s+/g, '') === s); };
const bookByName = (n) => BOOKS?.find((b) => b.name === n);
const readHref = (bookName, ch, v) => { const b = bookByName(bookName); return b ? `#/read/${slug(b)}/${ch}${v ? `?v=${v}` : ''}` : `#/search?q=${enc(`${bookName} ${ch}${v ? ':' + v : ''}`)}`; };

// ---------------------------------------------------------------------------
// UI helpers
// ---------------------------------------------------------------------------
let snackTimer;
function toast(msg, action) {
  const s = $('#snackbar');
  s.innerHTML = `<span>${esc(msg)}</span>${action ? `<button class="btn text">${esc(action.label)}</button>` : ''}`;
  if (action) $('button', s).onclick = () => { s.classList.remove('show'); action.fn(); };
  s.classList.add('show');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => s.classList.remove('show'), 3200);
}

async function copy(text, msg = 'Copied to clipboard') {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); } catch { /* ignore */ }
    ta.remove();
  }
  toast(msg);
}

async function withLoading(btn, fn) {
  const html = btn.innerHTML;
  btn.style.minWidth = btn.offsetWidth + 'px';
  btn.classList.add('loading');
  btn.innerHTML = DOTS_MONO;
  try { return await fn(); }
  finally { btn.innerHTML = html; btn.classList.remove('loading'); btn.style.minWidth = ''; }
}

const skLines = (n) => Array.from({ length: n }, (_, i) => `<span class="sk sk-line" style="width:${[96, 88, 92, 74, 98, 81, 90, 66][i % 8]}%"></span>`).join('');
const skList = (n) => Array.from({ length: n }, () => `<div class="list-item sk-item"><span class="sk" style="width:42px;height:42px;border-radius:14px;flex-shrink:0"></span><div class="li-main"><span class="sk" style="width:42%;height:15px;margin:2px 0 10px"></span><span class="sk" style="width:78%;height:12px"></span></div></div>`).join('');
const stateHTML = ({ ic, title, text, extra = '' }) => `<div class="state"><div class="big-ic">${icon(ic)}</div><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${extra}</div>`;

function showError(el, err, retry) {
  const title = err.status === 404 ? 'Not found' : err.status === 0 ? 'Connection problem' : err.status === 400 ? 'Check your request' : 'Something went wrong';
  el.innerHTML = `<div class="state error"><div class="big-ic">${icon(err.status === 0 ? 'cloud_off' : err.status === 404 ? 'search_off' : 'error')}</div><h3>${title}</h3><p>${esc(err.message)}</p>${retry ? `<button class="btn tonal" data-retry>${icon('refresh')}Try again</button>` : ''}</div>`;
  if (retry) $('[data-retry]', el).onclick = retry;
}

const sourceLabel = (h) => (h.source ? `${h.source.replace(/s*(d{4})$/, '').replace(/ Nos. 1 to 6$/, '')} No. ${h.source_number}` : '');
const hymnMeta = (h) => [h.author, h.year].filter(Boolean).join(' · ') || sourceLabel(h);
const fmtVerse = (t) => esc(t).replace(/\[([^\]]+)\]/g, '<i>$1</i>');
const fmtSnippet = (s) => esc(s).replace(/\[/g, '<mark>').replace(/\]/g, '</mark>').replace(/\n/g, ' / ');
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function markTerms(html, q) {
  const words = (q.match(WORDS_RE) || []).filter((w) => w.length > 1);
  if (!words.length) return html;
  let re;
  try { re = new RegExp(`(^|[^\\p{L}&#])(${words.map(reEsc).join('|')})(\\p{L}*)`, 'giu'); }
  catch (e) { re = new RegExp(`(^|[^A-Za-z&#])(${words.map(reEsc).join('|')})([A-Za-z]*)`, 'gi'); }
  return html.replace(re, (m, pre, w, rest) => `${pre}<mark>${w}${rest}</mark>`);
}
const fmtSize = (n) => n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`;
const STATUS_TEXT = { 0: 'Network error', 200: 'OK', 400: 'Bad Request', 404: 'Not Found', 500: 'Server Error' };

function highlight(value) {
  if (typeof value === 'string') return esc(value);
  return JSON.stringify(value, null, 2).replace(
    /("(?:\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(?:true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|[&<>]/g,
    (m, str, colon) => {
      if (str) return `<span class="${colon ? 'j-key' : 'j-str'}">${esc(str)}</span>${colon || ''}`;
      if (m === '&' || m === '<' || m === '>') return esc(m);
      if (m === 'true' || m === 'false') return `<span class="j-bool">${m}</span>`;
      if (m === 'null') return '<span class="j-null">null</span>';
      return `<span class="j-num">${m}</span>`;
    });
}

function countUp(el, n) {
  const t0 = performance.now(), dur = 900;
  const step = (t) => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(n * e).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function setFont(scale) {
  scale = Math.min(1.6, Math.max(0.8, Math.round(scale * 10) / 10));
  document.documentElement.style.setProperty('--read-scale', scale);
  store.set('font', scale);
  return scale;
}
const bumpFont = (d) => { const s = setFont(Number(getComputedStyle(document.documentElement).getPropertyValue('--read-scale')) + d * 0.1); toast(`Text size ${Math.round(s * 100)}%`); };

// Sheet (dialog on desktop, bottom sheet on mobile)
function openSheet(title, bodyHTML = '', { wide = false } = {}) {
  const d = document.createElement('dialog');
  d.className = 'sheet' + (wide ? ' wide' : '');
  d.innerHTML = `<div class="sheet-handle"></div><div class="sheet-head"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div><div class="sheet-body">${bodyHTML}</div>`;
  const close = () => {
    if (!d.open || d.classList.contains('closing')) return;
    d.classList.add('closing');
    setTimeout(() => d.close(), reduceMotion() ? 0 : 180);
  };
  d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) close(); });
  d.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
  d.addEventListener('close', () => d.remove());
  document.body.append(d);
  if (typeof d.showModal === 'function') {
    d.showModal();
  } else {
    // No <dialog> support: emulate a modal sheet.
    const backdrop = document.createElement('div');
    backdrop.className = 'sheet-backdrop';
    backdrop.onclick = close;
    document.body.insertBefore(backdrop, d);
    d.classList.add('fallback');
    d.setAttribute('open', '');
    d.open = true;
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    d.close = () => {
      d.open = false;
      d.removeAttribute('open');
      document.removeEventListener('keydown', onKey);
      backdrop.remove();
      d.dispatchEvent(new Event('close'));
    };
    d.addEventListener('animationstart', () => { if (d.classList.contains('closing')) backdrop.classList.add('closing'); });
  }
  d.closeSheet = close;
  return d;
}

// ---------------------------------------------------------------------------
// Network inspector
// ---------------------------------------------------------------------------
let inspector = null;
function pushLog(entry) {
  LOG.unshift(entry);
  if (LOG.length > 80) LOG.pop();
  const b = $('#logCount');
  b.hidden = false;
  b.textContent = LOG.length > 99 ? '99+' : LOG.length;
  if (inspector) renderInspector();
}
function openInspector(focusPath) {
  inspector = openSheet('Network activity', '', { wide: true });
  $('.sheet-head [data-close]', inspector).insertAdjacentHTML('beforebegin', `<button class="btn text" id="logClear">${icon('delete_sweep')}Clear</button>`);
  $('#logClear', inspector).onclick = () => { LOG.length = 0; $('#logCount').hidden = true; renderInspector(); };
  inspector.addEventListener('close', () => { inspector = null; });
  $('.sheet-body', inspector).addEventListener('toggle', (e) => {
    const det = e.target;
    if (det.open && !det.dataset.filled) { const en = LOG.find((x) => x.id == det.dataset.id); if (en) { $('pre', det).innerHTML = highlight(en.body); det.dataset.filled = 1; } }
  }, true);
  const focus = focusPath ? LOG.find((e) => e.path === focusPath) : null;
  renderInspector(focus?.id);
}
function renderInspector(focusId) {
  const body = $('.sheet-body', inspector);
  const openIds = new Set($$('details[open]', body).map((d) => Number(d.dataset.id)));
  if (focusId) openIds.add(focusId);
  if (!LOG.length) {
    body.innerHTML = stateHTML({ ic: 'wifi_tethering', title: 'No requests yet', text: 'Every call this site makes to the API appears here, live, with its full JSON response.' });
    return;
  }
  body.innerHTML = `<p class="muted small" style="margin:0 0 12px">Every request this page sent to the API, newest first. Open one to see the exact response body.</p>` +
    LOG.map((e) => {
      const ok = e.status >= 200 && e.status < 300;
      return `<details class="log" data-id="${e.id}" ${openIds.has(e.id) ? 'open' : ''}><summary><span class="status ${ok ? 'ok' : 'err'}">${e.status || 'ERR'}</span><span class="method">GET</span><code class="log-path">${esc(e.path)}</code><span class="log-ms">${e.ms} ms · ${fmtSize(e.size)}</span></summary><div class="log-body"><div class="url-bar"><code>${esc(e.url)}</code><button class="icon-btn" data-copy="${esc(e.url)}" aria-label="Copy URL">${icon('content_copy')}</button><a class="icon-btn" href="${esc(e.url)}" target="_blank" rel="noopener" aria-label="Open in new tab">${icon('open_in_new')}</a></div><pre class="code"></pre></div></details>`;
    }).join('');
  $$('details[open]', body).forEach((det) => { const en = LOG.find((x) => x.id == det.dataset.id); $('pre', det).innerHTML = highlight(en.body); det.dataset.filled = 1; });
  if (focusId) $(`details[data-id="${focusId}"]`, body)?.scrollIntoView({ block: 'nearest' });
}

// ---------------------------------------------------------------------------
// Verse selection bar
// ---------------------------------------------------------------------------
const sel = { verses: new Map(), book: '', ch: 0 };
function updateSelbar() {
  const n = sel.verses.size;
  $('#selbar').classList.toggle('show', n > 0);
  if (n) $('#selCount').textContent = `${n} verse${n > 1 ? 's' : ''} selected`;
}
function clearSelection() { sel.verses.clear(); $$('.verse.selected').forEach((v) => v.classList.remove('selected')); updateSelbar(); }
function selectionText() {
  const nums = [...sel.verses.keys()].sort((a, b) => a - b);
  const ranges = [];
  for (const n of nums) { const last = lastOf(ranges); if (last && n === last[1] + 1) last[1] = n; else ranges.push([n, n]); }
  const label = `${sel.book} ${sel.ch}:${ranges.map(([a, b]) => (a === b ? a : `${a}-${b}`)).join(',')}`;
  const text = nums.map((n) => (nums.length > 1 ? `${n} ` : '') + sel.verses.get(n)).join(' ');
  return `${text}\n— ${label} (KJV)`;
}

// ---------------------------------------------------------------------------
// Router
// ---------------------------------------------------------------------------
const main = $('#main');
let viewCtrl = null, keys = {}, closePresent = null;

const ROUTES = [
  { re: /^\/?$/, view: viewHome, nav: 'home' },
  { re: /^\/read(?:\/([^/]+))?(?:\/(\d+))?\/?$/, view: viewRead, nav: 'read' },
  { re: /^\/hymns\/?$/, view: viewHymns, nav: 'hymns' },
  { re: /^\/hymns\/(\d+)\/?$/, view: viewHymn, nav: 'hymns' },
  { re: /^\/search\/?$/, view: viewSearch, nav: 'search' },
  { re: /^\/api(?:\/([\w-]+))?\/?$/, view: viewApi, nav: 'api' },
];

function parseHash() {
  const h = location.hash.replace(/^#/, '');
  const i = h.indexOf('?');
  return { path: i < 0 ? h : h.slice(0, i), params: new URLSearchParams(i < 0 ? '' : h.slice(i + 1)) };
}

function route() {
  const { path, params } = parseHash();
  viewCtrl?.abort();
  viewCtrl = new AbortController();
  closePresent?.();
  clearSelection();
  keys = {};
  $$('dialog.sheet[open]').forEach((d) => { if (typeof d.close === 'function') d.close(); });

  let hit = null, m = null;
  for (const r of ROUTES) { m = path.match(r.re); if (m) { hit = r; break; } }
  $$('[data-nav]').forEach((a) => { const on = hit && a.dataset.nav === hit.nav; a.classList.toggle('active', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });

  const el = document.createElement('section');
  el.className = 'view';
  main.innerHTML = '';
  main.appendChild(el);
  window.scrollTo(0, 0);
  if (!hit) {
    document.title = 'Not found · Bible & Hymns';
    el.innerHTML = stateHTML({ ic: 'explore_off', title: 'Page not found', text: 'That page does not exist.', extra: `<a class="btn tonal" href="#/">${icon('home')}Go home</a>` });
    return;
  }
  hit.view(el, m.slice(1), params, viewCtrl.signal);
}

// ---------------------------------------------------------------------------
// Home
// ---------------------------------------------------------------------------
function viewHome(el, _, __, signal) {

  const feature = (href, ic, color, title, desc, i) => `<a class="feature" href="${href}" style="--i:${i}"><span class="ic" style="background:${color}22;color:${color}">${icon(ic)}</span><b>${title}</b><span class="d">${desc}</span></a>`;
  el.innerHTML = `
    <div class="hero">
      <img class="hero-logo" src="brand/logo.svg" alt="" width="88" height="88">
      <h1>Read, search and sing,<br><span class="accent">all in one place</span></h1>
      <p class="lead">The King James Bible and well-loved hymns — free, fast and easy to use on any device. Building an app? Everything here is also an open API.</p>
      <form class="search-pill big" id="homeSearch" role="search">
        ${icon('search')}
        <input name="q" type="search" aria-label="Search" placeholder="Search a word or type John 3:16" autocomplete="off" enterkeyhint="search">
        <button class="icon-btn" aria-label="Search">${icon('arrow_forward')}</button>
      </form>
      <div class="chips">${SUGGESTIONS.map((q) => `<a class="chip" href="#/search?q=${enc(q)}">${esc(q)}</a>`).join('')}</div>
      <div class="hero-ctas">
        <a class="btn" href="#/read">${icon('menu_book')}Start reading</a>
        <a class="btn tonal" href="#/hymns">${icon('music_note')}Browse hymns</a>
      </div>
    </div>
    <div class="grid stats stagger">
      ${stat('menu_book', 'books', 'Books', 0)}${stat('format_list_numbered', 'chapters', 'Chapters', 1)}${stat('notes', 'verses', 'Verses', 2)}${stat('music_note', 'hymns', 'Hymns', 3)}
    </div>
    <div class="grid two" style="margin-top:16px">
      <div class="card"><div class="card-head">${icon('auto_awesome')}<span>Random verse</span><span class="spacer"></span><button class="icon-btn" id="newVerse" aria-label="Another verse" title="Another verse">${icon('refresh')}</button></div><div id="votd">${skLines(3)}</div></div>
      <div class="card"><div class="card-head">${icon('library_music')}<span>Hymn spotlight</span><span class="spacer"></span><button class="icon-btn" id="newHymn" aria-label="Another hymn" title="Another hymn">${icon('refresh')}</button></div><div id="spot">${skLines(4)}</div></div>
    </div>
    <h2 class="h2">What you can do</h2>
    <div class="grid features stagger">
      ${feature('#/read', 'menu_book', '#4285f4', 'Read the Bible', 'All 66 books, chapter by chapter. Tap verses to copy or share them.', 0)}
      ${feature('#/hymns', 'music_note', '#ea4335', 'Sing hymns', 'Find any hymn by title or words, and show it full screen in church.', 1)}
      ${feature('#/search', 'search', '#f9ab00', 'Search everything', 'Look up a word, a phrase or a reference like Romans 8:28.', 2)}
      ${feature('#/read/ps/23', 'favorite', '#34a853', 'Comfort & psalms', 'Start with Psalm 23, then keep reading where you left off.', 3)}
    </div>

    <section class="dev-band">
      <div class="dev-copy">
        <span class="eyebrow-pill">${icon('code', 'sm')}For developers</span>
        <h2>Build with the same data</h2>
        <p class="muted">Every verse and hymn on this site comes from a free JSON API. No key, no sign-up, CORS enabled — call it from any website or app.</p>
        <div class="row">
          <a class="btn" href="#/api">${icon('terminal')}Open API explorer</a>
          <a class="btn text" href="/v1" target="_blank" rel="noopener">${icon('data_object')}JSON index</a>
        </div>
        <span class="live-pill" id="health"><span class="pulse"></span><span>Checking API…</span></span>
      </div>
      <div class="card dev-code">
        <div class="seg" role="tablist" id="qsTabs">${['JavaScript', 'Python', 'cURL'].map((t, i) => `<button role="tab" class="${i ? '' : 'active'}" data-t="${t}">${t}</button>`).join('')}</div>
        <div class="code-wrap" style="margin-top:16px"><pre class="code" id="qsCode"></pre><button class="icon-btn copy" id="qsCopy" aria-label="Copy code">${icon('content_copy')}</button></div>
      </div>
    </section>`;

  // live API health
  const t0 = performance.now();
  request('/v1', signal).then((e) => {
    const pill = $('#health', el), ok = e.status === 200;
    pill.classList.add(ok ? 'ok' : 'bad');
    pill.lastElementChild.textContent = ok ? `API online · ${Math.round(performance.now() - t0)} ms` : 'API unreachable';

async function viewRead(el, [bSlug, chStr], params, signal) {
  el.innerHTML = `<div class="reader-bar"><span class="sk" style="width:130px;height:40px;border-radius:20px"></span><span class="sk" style="width:110px;height:40px;border-radius:20px"></span></div><article class="reader"><div class="reader-head"><span class="sk" style="width:160px;height:12px;margin:0 auto 14px"></span><span class="sk" style="width:200px;height:40px;margin:0 auto"></span></div>${skLines(12)}</article>`;
  let books;
  try { books = await getBooks(); } catch (e) { return showError(el, e, route); }
  if (signal.aborted) return;

  const last = store.get('lastRead', { book: 'john', chapter: 1 });
  const book = bookFromSlug(bSlug || last.book) || bookFromSlug('john');
  if (bSlug && !bookFromSlug(bSlug)) toast(`Unknown book “${decodeURIComponent(bSlug)}” — showing ${book.name}`);
  const ch = Math.min(Math.max(parseInt(chStr || (bSlug ? 1 : last.chapter), 10) || 1, 1), book.chapters);
  const canonical = `#/read/${slug(book)}/${ch}`;
  if (!location.hash.startsWith(canonical)) history.replaceState(null, '', canonical + (params.toString() ? `?${params}` : ''));
  store.set('lastRead', { book: slug(book), chapter: ch });
  document.title = `${book.name} ${ch} · KJV`;

  const idx = books.indexOf(book);
  const prev = ch > 1 ? [book, ch - 1] : idx > 0 ? [books[idx - 1], books[idx - 1].chapters] : null;
  const next = ch < book.chapters ? [book, ch + 1] : idx < books.length - 1 ? [books[idx + 1], 1] : null;
  const href = (p) => `#/read/${slug(p[0])}/${p[1]}`;
  keys = { left: prev && href(prev), right: next && href(next) };
  const path = `/v1/bible/kjv/${slug(book)}/${ch}`;

  el.innerHTML = `
    <div class="reader-bar">
      <button class="btn tonal" id="pickBook">${esc(book.name)}${icon('arrow_drop_down')}</button>
      <button class="btn tonal" id="pickCh">${book.chapters > 1 ? `Ch. ${ch}` : 'Ch. 1'}${icon('arrow_drop_down')}</button>
      <span class="spacer"></span>
      <button class="icon-btn hide-sm" data-font="-1" aria-label="Smaller text" title="Smaller text">${icon('text_decrease')}</button>
      <button class="icon-btn hide-sm" data-font="1" aria-label="Larger text" title="Larger text">${icon('text_increase')}</button>
      <button class="icon-btn" id="json" aria-label="View JSON response" title="View JSON response">${icon('data_object')}</button>
      <a class="icon-btn ${prev ? '' : 'disabled'}" href="${prev ? href(prev) : '#'}" aria-label="Previous chapter" title="Previous chapter (←)">${icon('chevron_left')}</a>
      <a class="icon-btn ${next ? '' : 'disabled'}" href="${next ? href(next) : '#'}" aria-label="Next chapter" title="Next chapter (→)">${icon('chevron_right')}</a>
    </div>
    <article class="reader">
      <header class="reader-head"><div class="eyebrow">${book.testament === 'OT' ? 'Old' : 'New'} Testament · King James Version</div><h1>${esc(book.name)} ${ch}</h1></header>
      <div class="verses" id="verses">${skLines(14)}</div>
      <nav class="pager">
        ${prev ? `<a href="${href(prev)}"><span class="dir">${icon('chevron_left', 'sm')}Previous</span>${esc(prev[0].name)} ${prev[1]}</a>` : '<span></span>'}
        ${next ? `<a class="next" href="${href(next)}"><span class="dir">Next${icon('chevron_right', 'sm')}</span>${esc(next[0].name)} ${next[1]}</a>` : ''}
      </nav>
    </article>`;

  $('#pickBook', el).onclick = () => openPicker(books, book, ch, 'book');
  $('#pickCh', el).onclick = () => openPicker(books, book, ch, book.chapters > 1 ? 'chapter' : 'book');
  $('#json', el).onclick = () => openInspector(path);
  $$('[data-font]', el).forEach((b) => (b.onclick = () => bumpFont(Number(b.dataset.font))));

  const box = $('#verses', el);
  async function load() {
    box.innerHTML = skLines(14);
    try {
      const data = await api(path, { signal });
      sel.book = book.name; sel.ch = ch;
      box.innerHTML = `<div class="stagger">${data.verses.map((v, i) => `<p class="verse" data-v="${v.verse}" tabindex="0" style="--i:${Math.min(i, 24)}"><sup>${v.verse}</sup>${fmtVerse(v.text)}</p>`).join('')}</div>`;
      box.onclick = (e) => {
        const p = e.target.closest('.verse'); if (!p) return;
        const n = Number(p.dataset.v), v = data.verses.find((x) => x.verse === n);
        if (sel.verses.has(n)) { sel.verses.delete(n); p.classList.remove('selected'); } else { sel.verses.set(n, v.text); p.classList.add('selected'); }
        updateSelbar();
      };
      box.onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.verse')) { e.preventDefault(); e.target.click(); } };
      const want = params.get('v');
      if (want) {
        const [a, b] = want.split('-').map(Number);
        const hits = $$('.verse', box).filter((x) => { const n = Number(x.dataset.v); return n >= a && n <= (b || a); });
        hits.forEach((x) => x.classList.add('flash'));
        setTimeout(() => hits[0]?.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }), 120);
      }
    } catch (e) { if (!aborted(e)) showError(box, e, load); }
  }
  load();
}

function openPicker(books, current, ch, step) {
  const d = openSheet('');
  const head = $('.sheet-head h2', d), body = $('.sheet-body', d);
  const go = (bk, c) => { d.closeSheet(); location.hash = `#/read/${slug(bk)}/${c}`; };

  const showBooks = () => {
    head.textContent = 'Choose a book';
    body.innerHTML = `<div class="search-pill" style="margin:4px 0 4px">${icon('search')}<input id="bf" type="search" placeholder="Filter books" autocomplete="off" aria-label="Filter books"></div><div id="bl"></div>`;
    const render = (f = '') => {
      const key = f.toLowerCase().replace(/\s+/g, '');
      const section = (t, label) => {
        const list = books.filter((b) => b.testament === t && b.name.toLowerCase().replace(/\s+/g, '').includes(key));
        return list.length ? `<div class="section-label">${label}</div><div class="book-grid">${list.map((b) => `<button class="book-btn ${b === current ? 'current' : ''}" data-b="${b.id}">${esc(b.name)}</button>`).join('')}</div>` : '';
      };
      $('#bl', body).innerHTML = (section('OT', 'Old Testament') + section('NT', 'New Testament')) || stateHTML({ ic: 'search_off', title: 'No books match', text: `Nothing called “${f}”.` });
    };
    render();
    const inp = $('#bf', body);
    inp.oninput = () => render(inp.value);
    inp.onkeydown = (e) => { if (e.key === 'Enter') $('.book-btn', body)?.click(); };
    body.onclick = (e) => { const b = e.target.closest('[data-b]'); if (!b) return; const bk = books[Number(b.dataset.b) - 1]; bk.chapters === 1 ? go(bk, 1) : showChapters(bk); };
    if (isDesktop()) inp.focus();
    $('.book-btn.current', body)?.scrollIntoView({ block: 'center' });
  };

  const showChapters = (bk) => {
    head.innerHTML = `<button class="icon-btn" id="pickBack" aria-label="Back to books">${icon('arrow_back')}</button>${esc(bk.name)}`;
    $('#pickBack', head).onclick = (e) => { e.stopPropagation(); showBooks(); };
    body.innerHTML = `<div class="section-label">Chapters</div><div class="ch-grid stagger">${Array.from({ length: bk.chapters }, (_, i) => `<button class="ch-btn ${bk === current && i + 1 === ch ? 'current' : ''}" data-c="${i + 1}" style="--i:${Math.min(i, 30)}">${i + 1}</button>`).join('')}</div>`;
    body.onclick = (e) => { const c = e.target.closest('[data-c]'); if (c) go(bk, Number(c.dataset.c)); };
    body.scrollTop = 0;
  };

  step === 'chapter' ? showChapters(current) : showBooks();
}

function viewHymns(el, _, params, signal) {
  document.title = 'Hymns · Bible & Hymns';

  el.innerHTML = `
    <div class="page-head">
      <div><h1>Hymns</h1><p class="muted" id="hcount"><span class="sk" style="display:inline-block;width:160px;height:14px"></span></p></div>
      <button class="btn tonal" id="rnd">${icon('shuffle')}Random hymn</button>
    </div>

      <span class="pill-loader" hidden>${DOTS_SM}</span>
      <button class="icon-btn" id="hclear" aria-label="Clear search" ${q ? '' : 'hidden'}>${icon('close')}</button>
    </div>
    <div id="hlist" class="list stagger" style="margin-top:14px">${skList(8)}</div>
    <div id="hmore" class="center"></div>`;

  const list = $('#hlist', el), more = $('#hmore', el), input = $('#hq', el), loader = $('.pill-loader', el), count = $('#hcount', el);
  const LIMIT = 50;
  let offset = 0, ctrl = null;
  const item = (h, i) => `<a class="list-item" href="#/hymns/${h.id}" style="--i:${Math.min(i, 16)}"><span class="num-badge">${h.id}</span><div class="li-main"><div class="li-title">${esc(h.title)}</div><div class="li-sub">${h.match ? fmtSnippet(h.match) : esc(h.first_line)}</div></div><span class="li-meta">${esc(hymnMeta(h))}</span></a>`;

  async function load(reset) {
    ctrl?.abort();
    ctrl = new AbortController();
    const sig = ctrl.signal;
    signal.addEventListener('abort', () => ctrl.abort(), { once: true });
    if (reset) { offset = 0; if (!$('.sk-item', list)) list.classList.add('dim'); loader.hidden = !q; }
    const path = `/v1/hymns?${q ? `q=${enc(q)}&` : ''}limit=${LIMIT}&offset=${offset}`;
    try {
      const data = await api(path, { signal: sig });
      const items = q ? data.results : data.hymns;
      const html = items.map((h, i) => item(h, i)).join('');
      if (reset) list.innerHTML = html; else list.insertAdjacentHTML('beforeend', html);
      const shown = offset + items.length;
      count.textContent = q ? `${shown}${items.length === LIMIT ? '+' : ''} result${shown === 1 ? '' : 's'} for “${q}”` : `${data.total} hymns · all public domain`;
      if (reset && !items.length) list.innerHTML = stateHTML({ ic: 'search_off', title: 'No hymns found', text: `Nothing matches “${q}”. Try a different word or phrase.` });
      const hasMore = q ? items.length === LIMIT : shown < data.total;
      offset = shown;
      more.innerHTML = hasMore ? `<button class="btn outline" id="moreBtn">${icon('expand_more')}Load more</button>` : '';
      if (hasMore) $('#moreBtn', more).onclick = (e) => withLoading(e.currentTarget, () => load(false));
    } catch (e) {
      if (aborted(e)) return;
      if (reset) showError(list, e, () => load(true)); else toast(e.message, { label: 'Retry', fn: () => load(false) });
    } finally {
      if (!sig.aborted) { loader.hidden = true; list.classList.remove('dim'); }
    }
  }

  const search = debounce(() => load(true), 260);
  input.oninput = () => {
    q = input.value.trim();
    $('#hclear', el).hidden = !q;
    history.replaceState(null, '', `#/hymns${q ? `?q=${enc(q)}` : ''}`);
    loader.hidden = !q;
    search();
  };
  input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
  $('#hclear', el).onclick = () => { input.value = ''; input.oninput(); input.focus(); };
  $('#rnd', el).onclick = (e) => withLoading(e.currentTarget, async () => {
    try { const h = await api('/v1/hymns/random', { signal }); location.hash = `#/hymns/${h.id}`; }
    catch (err) { if (!aborted(err)) toast(err.message); }
  });
  load(true);
}
