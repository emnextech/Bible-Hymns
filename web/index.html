function present(h) {
  const choruses = h.parts.filter((p) => p.kind === 'chorus');
  const chorus = choruses.length === 1 ? choruses[0] : null;
  const seq = chorus ? h.parts.filter((p) => p.kind !== 'chorus').flatMap((p) => [p, chorus]) : h.parts;
  let i = 0;
  const ov = document.createElement('div');
  ov.className = 'present';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-label', `Presenting ${h.title}`);
  ov.innerHTML = `
    <div class="present-top"><span>${esc(h.title)}</span><span class="spacer"></span><span id="pc"></span>
      <button class="icon-btn" data-fs aria-label="Full screen" title="Full screen (F)">${icon('fullscreen')}</button>
      <button class="icon-btn" data-x aria-label="Close" title="Close (Esc)">${icon('close')}</button></div>
    <div class="present-stage" id="ps"></div>
    <div class="present-nav"><button class="icon-btn" data-prev aria-label="Previous">${icon('chevron_left')}</button><div class="present-bar"><i></i></div><button class="icon-btn" data-next aria-label="Next">${icon('chevron_right')}</button></div>`;
  const render = () => {
    const p = seq[i];
    $('#ps', ov).innerHTML = `<div class="present-slide"><div class="present-label">${p.kind === 'chorus' ? 'Chorus' : `Verse ${p.number}`}</div><div class="present-text">${p.lines.map(esc).join('<br>')}</div></div>`;
    $('#pc', ov).textContent = `${i + 1} / ${seq.length}`;
    $('.present-bar i', ov).style.width = `${((i + 1) / seq.length) * 100}%`;
  };
  const go = (d) => { const n = i + d; if (n >= 0 && n < seq.length) { i = n; render(); } };
  const toggleFs = () => { if (document.fullscreenElement) document.exitFullscreen?.(); else ov.requestFullscreen?.().catch(() => {}); };
  const close = () => {
    document.removeEventListener('keydown', onKey);
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    ov.remove();
    document.body.style.overflow = '';
    closePresent = null;
  };
  const onKey = (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === 'Escape') close();
    else if (e.key === 'f' || e.key === 'F') toggleFs();
  };
  ov.addEventListener('click', (e) => {
    if (e.target.closest('[data-x]')) return close();
    if (e.target.closest('[data-fs]')) return toggleFs();
    if (e.target.closest('[data-prev]')) return go(-1);
    if (e.target.closest('[data-next]')) return go(1);
    if (e.target.closest('#ps')) go(e.clientX < window.innerWidth / 3 ? -1 : 1);
  });
  let sx = 0;
  ov.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  ov.addEventListener('touchend', (e) => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); });
  document.addEventListener('keydown', onKey);
  document.body.append(ov);
  document.body.style.overflow = 'hidden';
  closePresent = close;
  render();
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------
function viewSearch(el, _, params, signal) {
  let q = (params.get('q') || '').trim();
  let type = ['all', 'bible', 'hymns'].includes(params.get('type')) ? params.get('type') : 'all';
  document.title = (q ? `${q} · ` : '') + 'Search · Bible & Hymns';
  el.innerHTML = `
    <div style="height:16px"></div>
    <form class="search-pill big" id="sform" role="search">
      ${icon('search')}
      <input id="sq" type="search" value="${esc(q)}" placeholder="Search the Bible and hymns, or type John 3:16" autocomplete="off" enterkeyhint="search" aria-label="Search">
      <span class="pill-loader" hidden>${DOTS_SM}</span>
      <button type="button" class="icon-btn" id="sclear" aria-label="Clear" ${q ? '' : 'hidden'}>${icon('close')}</button>
    </form>
    <div class="chips filters" role="tablist" aria-label="Filter results">${[['all', 'All', 'apps'], ['bible', 'Bible', 'menu_book'], ['hymns', 'Hymns', 'music_note']].map(([k, l, ic]) => `<button type="button" class="chip ${type === k ? 'active' : ''}" data-type="${k}" role="tab" aria-selected="${type === k}">${icon(type === k ? 'check' : ic)}${l}</button>`).join('')}</div>
    <div id="sres"></div>`;

  const input = $('#sq', el), res = $('#sres', el), loader = $('.pill-loader', el);
  let ctrl = null, offset = 0, total = 0, passage = null;
  const sync = () => history.replaceState(null, '', `#/search${q ? `?q=${enc(q)}${type !== 'all' ? `&type=${type}` : ''}` : ''}`);
  const saveRecent = () => { if (!q) return; const r = store.get('recent', []).filter((x) => x.toLowerCase() !== q.toLowerCase()); r.unshift(q); store.set('recent', r.slice(0, 8)); };

  function renderEmpty() {
    const recent = store.get('recent', []);
    res.innerHTML = `
      ${recent.length ? `<div class="section-title">${icon('history')}Recent searches</div><div class="chips">${recent.map((r) => `<a class="chip" href="#/search?q=${enc(r)}">${icon('history')}${esc(r)}</a>`).join('')}<button class="chip" id="clrRecent">${icon('delete')}Clear</button></div>` : ''}
      <div class="section-title">${icon('lightbulb')}Try searching</div>
      <div class="chips">${SUGGESTIONS.map((s) => `<a class="chip" href="#/search?q=${enc(s)}">${esc(s)}</a>`).join('')}</div>
      <p class="muted small" style="margin-top:24px">Tip: type a reference like <b>Romans 8:28</b>, <b>Ps 23</b> or <b>1 Jn 1:7-9</b> to jump straight to the passage. Press <b>/</b> anywhere to search.</p>`;
    $('#clrRecent', res)?.addEventListener('click', () => { store.set('recent', []); renderEmpty(); });
  }

  const verseResult = (v, i) => `<div class="result" style="--i:${Math.min(i, 12)}"><div class="crumb">KJV › ${esc(v.book)} › Chapter ${v.chapter}</div><h3><a href="${readHref(v.book, v.chapter, v.verse)}">${esc(v.reference)}</a></h3><p>${markTerms(fmtVerse(v.text), q)}</p></div>`;

  function renderMore() {
    const box = $('#vmore', res);
    if (!box) return;
    box.innerHTML = offset < total ? `<button class="btn outline" id="vmoreBtn">${icon('expand_more')}More verses (${(total - offset).toLocaleString()} left)</button>` : '';
    const btn = $('#vmoreBtn', box);
    if (btn) btn.onclick = () => withLoading(btn, async () => {
      try {
        const d = await api(`/v1/bible/kjv/search?q=${enc(q)}&limit=20&offset=${offset}`, { signal });
        $('#vres', res).insertAdjacentHTML('beforeend', d.results.map((v, i) => verseResult(v, i)).join(''));
        offset += d.results.length;
        renderMore();
      } catch (e) { if (!aborted(e)) toast(e.message); }
    });
  }

  async function run() {
    ctrl?.abort();
    ctrl = new AbortController();
    const sig = ctrl.signal;
    signal.addEventListener('abort', () => ctrl.abort(), { once: true });
    document.title = (q ? `${q} · ` : '') + 'Search · Bible & Hymns';
    if (!q) { loader.hidden = true; return renderEmpty(); }
    if (!HAS_WORD_RE.test(q)) { loader.hidden = true; res.innerHTML = stateHTML({ ic: 'keyboard', title: 'Type a word to search', text: 'Searches need at least one letter or number.' }); return; }

    loader.hidden = false;
    if ($('.results', res)) res.classList.add('dim');
    else res.innerHTML = `<div class="loading-block">${DOTS}<span>Searching…</span></div>`;
    try {
      const wantBible = type !== 'hymns', wantHymns = type !== 'bible';
      const [all, verses] = await Promise.all([
        api(`/v1/search?q=${enc(q)}`, { signal: sig }),
        wantBible ? api(`/v1/bible/kjv/search?q=${enc(q)}&limit=20`, { signal: sig }) : null,
        getBooks(),
      ]);
      passage = wantBible ? all.reference : null;
      total = verses ? verses.total : 0;
      offset = verses ? verses.results.length : 0;
      let html = '<div class="results">';
      if (passage) {
        const f = passage.verses[0], lastV = lastOf(passage.verses);
        const range = passage.verses.length > 1 && lastV.chapter === f.chapter ? `${f.verse}-${lastV.verse}` : f.verse;
        html += `<div class="card passage"><div class="crumb">${icon('auto_stories', 'sm')}Passage · King James Version</div><h2>${esc(passage.reference)}</h2><div class="passage-text">${passage.verses.slice(0, 40).map((v) => `<sup>${v.verse}</sup>${fmtVerse(v.text)}`).join(' ')}${passage.verses.length > 40 ? ' …' : ''}</div><div class="row"><a class="btn tonal" href="${readHref(f.book, f.chapter, range)}">${icon('menu_book')}Open in reader</a><button class="btn text" id="copyPassage">${icon('content_copy')}Copy</button></div></div>`;
      }
      if (wantHymns && all.hymns.length) {
        html += `<div class="section-title">${icon('music_note')}Hymns <span class="count">${all.hymns.length}</span></div><div class="list stagger">${all.hymns.map((h, i) => `<a class="list-item" href="#/hymns/${h.id}" style="--i:${i}"><span class="num-badge">${h.id}</span><div class="li-main"><div class="li-title">${esc(h.title)}</div><div class="li-sub">${fmtSnippet(h.match)}</div></div><span class="li-meta">${esc(hymnMeta(h))}</span></a>`).join('')}</div>`;
      }
      if (total) {
        html += `<div class="section-title">${icon('menu_book')}Bible verses <span class="count">${total.toLocaleString()}</span></div><div id="vres" class="stagger">${verses.results.map((v, i) => verseResult(v, i)).join('')}</div><div class="center" id="vmore"></div>`;
      }
      if (!passage && !(wantHymns && all.hymns.length) && !total) {
        html += stateHTML({ ic: 'search_off', title: `No results for “${q}”`, text: 'Check the spelling, try fewer words, or search a reference like Romans 8:28.' });
      }
      res.innerHTML = html + '</div>';
      $('#copyPassage', res)?.addEventListener('click', () => copy(`${passage.text}\n— ${passage.reference} (KJV)`, 'Passage copied'));
      renderMore();
    } catch (e) {
      if (aborted(e)) return;
      showError(res, e, run);
    } finally {
      if (!sig.aborted) { loader.hidden = true; res.classList.remove('dim'); }
    }
  }

  const runSoon = debounce(run, 300);
  input.oninput = () => { q = input.value.trim(); $('#sclear', el).hidden = !q; sync(); loader.hidden = !q; runSoon(); };
  $('#sform', el).onsubmit = (e) => { e.preventDefault(); q = input.value.trim(); sync(); saveRecent(); if (!isDesktop()) input.blur(); run(); };
  $('#sclear', el).onclick = () => { input.value = ''; input.oninput(); input.focus(); };
  $$('[data-type]', el).forEach((b) => (b.onclick = () => {
    type = b.dataset.type;
    $$('[data-type]', el).forEach((x) => {
      const on = x === b;
      x.classList.toggle('active', on);
      x.setAttribute('aria-selected', on);
      x.firstElementChild.textContent = on ? 'check' : { all: 'apps', bible: 'menu_book', hymns: 'music_note' }[x.dataset.type];
    });
    sync(); run();
  }));
  res.addEventListener('click', (e) => { if (e.target.closest('a[href^="#/read"], a[href^="#/hymns"]')) saveRecent(); });
  if (!q) input.focus();
  run();
}

// ---------------------------------------------------------------------------
// API explorer
// ---------------------------------------------------------------------------
const P = (name, where, value, hint = '', optional = false) => ({ name, in: where, value, hint, optional });
const ENDPOINTS = [
  { id: 'verse', group: 'Bible', title: 'Verse or range', path: '/v1/bible/{translation}/{book}/{chapter}/{verse}', desc: 'One verse or a verse range from a chapter. Books accept names, abbreviations and OSIS ids (john, jn, 1jn, ps…).', params: [P('translation', 'path', 'kjv'), P('book', 'path', 'john'), P('chapter', 'path', '3'), P('verse', 'path', '16-18', 'e.g. 16 or 16-18')] },
  { id: 'chapter', group: 'Bible', title: 'Chapter', path: '/v1/bible/{translation}/{book}/{chapter}', desc: 'A whole chapter, plus links to the previous and next chapter.', params: [P('translation', 'path', 'kjv'), P('book', 'path', 'psalms'), P('chapter', 'path', '23')] },
  { id: 'passage', group: 'Bible', title: 'Passage by reference', path: '/v1/bible/{translation}/passage', desc: 'Parse human references. Separate several with “;”. Handles ranges across chapters and single-chapter books.', params: [P('translation', 'path', 'kjv'), P('ref', 'query', 'Gen 1:1-3; Ps 23:1; Jude 24-25')] },
  { id: 'bible-search', group: 'Bible', title: 'Search verses', path: '/v1/bible/{translation}/search', desc: 'Full-text search, ranked by relevance. All words must match; words match as prefixes (believ → believe, believeth).', params: [P('translation', 'path', 'kjv'), P('q', 'query', 'only believe'), P('book', 'query', '', 'e.g. mark', true), P('limit', 'query', '5', '1-100', true), P('offset', 'query', '0', '', true)] },
  { id: 'random-verse', group: 'Bible', title: 'Random verse', path: '/v1/bible/{translation}/random', desc: 'A random verse — handy for a verse-of-the-day widget. Never cached.', params: [P('translation', 'path', 'kjv')] },
  { id: 'books', group: 'Bible', title: 'Books', path: '/v1/books', desc: 'All 66 books with OSIS id, testament and chapter count.', params: [] },
  { id: 'translations', group: 'Bible', title: 'Translations', path: '/v1/translations', desc: 'Available translations and their licences.', params: [] },
  { id: 'hymns', group: 'Hymns', title: 'List or search hymns', path: '/v1/hymns', desc: 'Without q: all hymns, paged. With q: full-text search over title, author and lyrics, with a highlighted snippet.', params: [P('q', 'query', '', 'e.g. blood lamb', true), P('limit', 'query', '10', '1-100', true), P('offset', 'query', '0', '', true)] },
  { id: 'hymn', group: 'Hymns', title: 'One hymn', path: '/v1/hymns/{id}', desc: 'A hymn with its verses and chorus, split into lines.', params: [P('id', 'path', '1')] },
  { id: 'random-hymn', group: 'Hymns', title: 'Random hymn', path: '/v1/hymns/random', desc: 'A random hymn. Never cached.', params: [] },
  { id: 'search', group: 'Everything', title: 'Search everything', path: '/v1/search', desc: 'Searches verses and hymns at once. If q is a Bible reference, the passage is returned too.', params: [P('q', 'query', 'grace'), P('translation', 'query', 'kjv', '', true)] },
  { id: 'index', group: 'Everything', title: 'API index', path: '/v1', desc: 'Machine-readable list of every endpoint with an example.', params: [] },
];

function viewApi(el, [epId], _, signal) {
  const ep = ENDPOINTS.find((e) => e.id === epId) || ENDPOINTS[0];
  document.title = `${ep.title} · API Explorer`;
  const groups = [...new Set(ENDPOINTS.map((e) => e.group))];
  el.innerHTML = `
    <div class="page-head"><div><h1>API Explorer</h1><p class="muted">Send live requests and inspect every response. All endpoints are <b>GET</b>, return JSON, allow CORS and need no key.</p></div></div>
    <div class="url-bar base">${icon('link', 'sm')}<span class="muted small">Base URL</span><code>${esc(PUBLIC_BASE)}</code><button class="icon-btn" data-copy="${esc(PUBLIC_BASE)}" aria-label="Copy base URL" title="Copy">${icon('content_copy')}</button></div>
    <div class="explorer">
      <nav class="ep-list" aria-label="Endpoints">${groups.map((g) => `<div class="ep-group">${g}</div>${ENDPOINTS.filter((e) => e.group === g).map((e) => `<a class="ep-item ${e === ep ? 'active' : ''}" href="#/api/${e.id}" ${e === ep ? 'aria-current="page"' : ''}><span class="method">GET</span>${esc(e.title)}</a>`).join('')}`).join('')}</nav>
      <section class="card ep-panel">
        <h2>${esc(ep.title)}</h2>
        <p class="muted">${esc(ep.desc)}</p>
        <div class="endpoint-line"><span class="method">GET</span><code>${esc(ep.path).replace(/\{(\w+)\}/g, '<span class="p">{$1}</span>')}</code></div>
        <form id="epForm" autocomplete="off">
          ${ep.params.length ? `<div class="params">${ep.params.map((p) => `<label class="field"><span class="field-label">${p.name} <em>${p.in}${p.optional ? ' · optional' : ''}</em></span><input name="${p.name}" value="${esc(p.value)}" placeholder="${esc(p.hint)}" spellcheck="false" autocapitalize="off"></label>`).join('')}</div>` : ''}
          <div class="row"><button class="btn" id="send" type="submit">${icon('send')}Send request</button><span class="muted small">Edit the fields, then send — or press Enter</span></div>
        </form>
        <div class="url-bar"><span class="method">GET</span><code id="reqUrl"></code><button type="button" class="icon-btn" id="copyUrl" aria-label="Copy URL" title="Copy URL">${icon('content_copy')}</button><a class="icon-btn" id="openUrl" target="_blank" rel="noopener" aria-label="Open in new tab" title="Open in new tab">${icon('open_in_new')}</a></div>
        <div class="seg" role="tablist" id="outTabs">${['Response', 'cURL', 'JavaScript', 'Python'].map((t, i) => `<button type="button" role="tab" class="${i ? '' : 'active'}" data-tab="${t}">${t}</button>`).join('')}</div>
        <div class="resp-meta" id="meta"></div>
        <div class="code-wrap"><pre class="code" id="out"></pre><button class="icon-btn copy" id="copyOut" aria-label="Copy" title="Copy">${icon('content_copy')}</button></div>
      </section>
    </div>`;

  const form = $('#epForm', el), out = $('#out', el), meta = $('#meta', el);
  let tab = 'Response', last = null;
  const buildPath = () => {
    const fd = new FormData(form);
    let path = ep.path.replace(/\{(\w+)\}/g, (_, n) => enc(String(fd.get(n) || '').trim()) || `{${n}}`);
    const qs = ep.params.filter((p) => p.in === 'query').map((p) => [p.name, String(fd.get(p.name) || '').trim()]).filter(([, v]) => v);
    if (qs.length) path += '?' + qs.map(([k, v]) => `${k}=${enc(v)}`).join('&');
    return path;
  };
  const snippet = (t, url) => ({
    cURL: `curl "${url}"`,
    JavaScript: `const res = await fetch("${url}");\nconst data = await res.json();\nconsole.log(data);`,
    Python: `import requests\n\nres = requests.get("${url}")\nprint(res.json())`,
  }[t]);
  const renderOut = () => {
    const url = PUBLIC_BASE + buildPath();
    if (tab === 'Response') out.innerHTML = last ? highlight(last.body) : '<span class="muted">Send a request to see the response body here.</span>';
    else out.textContent = snippet(tab, url);
  };
  const updateUrl = () => { const url = PUBLIC_BASE + buildPath(); $('#reqUrl', el).textContent = url; $('#openUrl', el).href = url; if (tab !== 'Response') renderOut(); };
  const setTab = (t) => { tab = t; $$('#outTabs button', el).forEach((b) => b.classList.toggle('active', b.dataset.tab === t)); renderOut(); };

  async function send() {
    setTab('Response');
    meta.innerHTML = `${DOTS_SM}<span>Sending request…</span>`;
    out.classList.add('dim');
    try { await withLoading($('#send', el), async () => { last = await request(buildPath(), signal); }); }
    catch (e) { if (aborted(e)) return; }
    out.classList.remove('dim');
    const ok = last.status >= 200 && last.status < 300;
    meta.innerHTML = `<span class="status ${ok ? 'ok' : 'err'}">${last.status || 'ERR'} ${STATUS_TEXT[last.status] || ''}</span><span>${icon('schedule', 'sm')}${last.ms} ms</span><span>${icon('data_object', 'sm')}${fmtSize(last.size)}</span><span class="spacer"></span><button class="btn text" id="seeLog">${icon('history')}All requests</button>`;
    $('#seeLog', meta).onclick = () => openInspector(last.path);
    renderOut();
  }

  form.addEventListener('input', updateUrl);
  form.addEventListener('submit', (e) => { e.preventDefault(); send(); });
  $('#outTabs', el).onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); };
  $('#copyUrl', el).onclick = () => copy(PUBLIC_BASE + buildPath(), 'URL copied');
  $('#copyOut', el).onclick = () => copy(tab === 'Response' ? (last ? JSON.stringify(last.body, null, 2) : '') : snippet(tab, PUBLIC_BASE + buildPath()));
  $('.ep-item.active', el)?.scrollIntoView({ block: 'nearest', inline: 'center' });
  window.scrollTo(0, 0);
  updateUrl();
  send();
}

// ---------------------------------------------------------------------------
// Global wiring
// ---------------------------------------------------------------------------
function effectiveTheme() { return document.documentElement.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function syncThemeIcon() { $('#themeBtn .msr').textContent = effectiveTheme() === 'dark' ? 'light_mode' : 'dark_mode'; }
$('#themeBtn').onclick = () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.set('theme', next);
  syncThemeIcon();
};
if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', syncThemeIcon); else if (mq.addListener) mq.addListener(syncThemeIcon); }

$('#openLog').onclick = () => openInspector();
$('#selCopy').onclick = () => copy(selectionText(), 'Verses copied');
$('#selShare').onclick = async () => {
  const text = selectionText();
  if (navigator.share) { try { await navigator.share({ text }); } catch { /* cancelled */ } }
  else copy(text, 'Verses copied');
};
$('#selClear').onclick = clearSelection;

document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-copy]');
  if (c) copy(c.dataset.copy, 'Copied');
});

// Material ripple
document.addEventListener('pointerdown', (e) => {
  const host = e.target.closest('.btn, .icon-btn:not(#openLog), .chip:not(.static), .tab, .nav-item .pill, a.list-item, .ep-item, .book-btn, .ch-btn, .feature, .pager a');
  if (!host) return;
  const r = host.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2;
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
  host.append(s);
  setTimeout(() => s.remove(), 650);
});

// Keyboard: "/" to search, ←/→ for previous/next chapter or hymn
document.addEventListener('keydown', (e) => {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey || closePresent || $('dialog[open]')) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (typing) return;
  if (e.key === '/') {
    e.preventDefault();
    const inp = $('#sq') || $('#hq') || $('#homeSearch input');
    if (inp) inp.focus(); else location.hash = '#/search';
  } else if (e.key === 'ArrowLeft' && keys.left) location.hash = keys.left;
  else if (e.key === 'ArrowRight' && keys.right) location.hash = keys.right;
  else if (e.key === 'Escape' && sel.verses.size) clearSelection();
});

const appbar = $('#appbar');
addEventListener('scroll', () => appbar.classList.toggle('scrolled', scrollY > 4), { passive: true });
addEventListener('hashchange', route);
addEventListener('online', () => toast('Back online'));
addEventListener('offline', () => toast('You are offline — requests will fail until you reconnect'));

// Boot
setFont(store.get('font', 1));
syncThemeIcon();
const bootStart = Date.now();
route();
window.__bhReady = true;
const fontsReady = document.fonts && document.fonts.load
  ? Promise.race([document.fonts.load('24px "Material Symbols Rounded"', 'home').then(() => document.fonts.ready), new Promise((r) => setTimeout(r, 1500))]).catch(() => {})
  : Promise.resolve();
fontsReady.then(() => {
  setTimeout(() => $('#boot').classList.add('hide'), Math.max(0, 450 - (Date.now() - bootStart)));
});
getBooks().catch(() => {});
})();
</script>
